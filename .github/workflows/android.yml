name: Android APK
on:
  push:
    branches: [main, 'feature/iqbot-0-4-offline-backtest', 'feature/iqbot-0-4-offline-replay']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo 'Android 35 platform will be installed by Gradle'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify pure Java strategy tests before packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iqbot-classes
          javac -d /tmp/iqbot-classes app/src/main/java/com/iqbot/demo/{StrategyEngine,CandleCsv,OutOfSample,StrategySelector,OfflineBacktest,ReplaySession}.java app/src/test/java/com/iqbot/demo/*Test.java
          : > strategy-test-results.txt
          for test in app/src/test/java/com/iqbot/demo/*Test.java; do
            name="$(basename "$test" .java)"
            echo "RUN $name" | tee -a strategy-test-results.txt
            java -cp /tmp/iqbot-classes "com.iqbot.demo.$name" 2>&1 | tee -a strategy-test-results.txt
            echo "PASS $name" | tee -a strategy-test-results.txt
          done
      - name: Verify UI strategy entry and broker isolation
        shell: bash
        run: |
          set -euo pipefail
          UI=app/src/main/java/com/iqbot/demo/MainActivity.java
          test -f app/src/main/java/com/iqbot/demo/BacktestActivity.java
          grep -Fq 'new Intent(this, BacktestActivity.class)' "$UI"
          grep -Fq 'DEMONSTRAÇÃO ALEATÓRIA (NÃO É A ESTRATÉGIA)' "$UI"
          grep -Fq 'Abrir o site não conecta sua conta ao IQBot.' "$UI"
          grep -Fq 'Intent.ACTION_VIEW' "$UI"
          grep -Fq 'StrategySelector.recommend(input, input.size() - 1)' app/src/main/java/com/iqbot/demo/BacktestActivity.java
          grep -Fq 'Recomendação CALL/WAIT:' app/src/main/java/com/iqbot/demo/BacktestActivity.java
          # The dashboard preview must use the same closed-candle selector as backtest.
          grep -Fq 'StrategySelector.recommend(previewCandles, previewCandles.size() - 1)' "$UI"
          grep -Fq 'OfflineBacktest.sample()' "$UI"
          grep -Fq 'série SINTÉTICA' "$UI"
          grep -Fq 'preview.selected.signal == StrategyEngine.Signal.CALL' "$UI"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK identity and version
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Eq "^package: name='com\\.iqbot\\.demo\\.lab' versionCode='6' versionName='0\\.4\\.2'" apk-badging.txt
          "$AAPT" dump permissions "$APK" > apk-permissions.txt
          if grep -Fq 'android.permission.INTERNET' apk-permissions.txt; then
            echo "Unexpected network permission in offline APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iqbot-lab-0.4-debug-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-badging.txt
            apk-sha256.txt
            apk-permissions.txt
            apk-signature.txt
            strategy-test-results.txt
  replay:
    needs: build
    uses: ./.github/workflows/android-replay-smoke.yml
    with:
      build_run: ${{ format('{0}', github.run_id) }}
    permissions:
      actions: read
      contents: read
