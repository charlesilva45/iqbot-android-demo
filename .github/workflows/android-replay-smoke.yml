name: Android replay smoke test
on:
  workflow_call:
    inputs:
      build_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      build_run:
        description: Android APK workflow run ID
        required: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: iqbot-lab-0.4-debug-apk
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verified-build
      - name: Boot Android API 35 and test the published debug artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd verified-build && sha256sum -c apk-sha256.txt)
          sudo chmod a+rw /dev/kvm
          IMAGE='system-images;android-35;default;x86_64'
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          command_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          for attempt in 1 2 3; do
            if "$command_tools/sdkmanager" 'emulator' 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' "$IMAGE"; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            sleep 5
          done
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          "$command_tools/avdmanager" create avd --force --name IQBotSmoke --package "$IMAGE" --path "$ANDROID_AVD_HOME/IQBotSmoke.avd" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx IQBotSmoke
          "$ANDROID_HOME/emulator/emulator" -avd IQBotSmoke -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'code=$?; if (( code != 0 )); then timeout 12 adb logcat -d -s AndroidRuntime ActivityManager | tail -120 || true; fi; adb emu kill || true' EXIT
          for ((attempt = 0; attempt < 90; attempt++)); do
            kill -0 "$emulator_pid"
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]
          bash scripts/android-replay-check/install.sh
          python3 scripts/emulator-replay-smoke.py verified-build/app/build/outputs/apk/debug/app-debug.apk
      - name: Capture emulator diagnostics
        if: failure()
        run: tail -120 "$RUNNER_TEMP/emulator.log" || true
