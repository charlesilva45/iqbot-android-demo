name: Strategy engine smoke test
on:
  push:
    branches: [main, 'feature/iqbot-0-4-offline-backtest']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strategy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run every pure Java strategy test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iqbot-classes
          javac -d /tmp/iqbot-classes app/src/main/java/com/iqbot/demo/{StrategyEngine,CandleCsv,OutOfSample,StrategySelector,OfflineBacktest}.java app/src/test/java/com/iqbot/demo/*Test.java
          count=0
          for test in app/src/test/java/com/iqbot/demo/*Test.java; do
            name="$(basename "$test" .java)"
            echo "RUN $name"
            java -cp /tmp/iqbot-classes "com.iqbot.demo.$name"
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "PASS: $count strategy test classes"
